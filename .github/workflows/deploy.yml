name: Publish site branch (code only)

# Fast path for CODE/UI changes, decoupled from the weekly DATA refresh.
#
# The map's data (web/data/*.geojson) is committed to the repo — the data-bot
# commits it on every refresh.yml run. So when a push only changes the site's
# code (index.html, JS, CSS), the last-good data is already on disk: there is
# nothing to download and nothing to regenerate. This workflow publishes the
# built static tree to the web-deployment branch. Seconds, not the 30-minute
# pipeline.
# web/verified/*.html (docs/VERIFICATION.md) is the same kind of artifact —
# regenerated by refresh.yml, not hand-edited — so it gets the same treatment.
#
# refresh.yml still owns the data path (download -> regenerate web/data ->
# deploy) on the weekly cron. This is purely the "I moved some buttons" path.
# Building a lens on top of ALREADY-COMMITTED data ships through here too; only
# a lens that needs a brand-new dataset still requires a data run (refresh.yml
# dispatch, or download_data.py --only <source> + that loader + commit).

on:
  push:
    branches: [master]
    # Deploy when the site's code changes, but NOT when only the bot's data
    # commit lands: web/data/** and web/verified/** are already deployed inside
    # the refresh run, so excluding them here avoids a redundant second deploy.
    # A push that touches both code and data still matches (the code path is
    # not excluded). Most non-web changes (docs/, src/, main.py,
    # session-summary/) don't alter the served artifact, so they correctly
    # don't trigger a deploy.
    #
    # ⚠️ scripts/build_site.py IS an exception and must stay listed: it is not
    # under web/, but it is the step that SHAPES the served artifact (the two
    # builds, the <base> tag, the badges). It was missing here until
    # 2026-08-28, when a badge change merged green, deployed nothing, and left
    # the live site serving the old shaping until an unrelated web/** push —
    # silent, green and stale. The rule is "what changes the artifact", not
    # "what lives in web/".
    paths:
      - 'web/**'
      - '!web/data/**'
      - '!web/verified/**'
      - 'scripts/build_site.py'          # shapes the artifact; see the note above
      - 'scripts/publish_site_branch.sh' # publishes the artifact branch
      - '.github/workflows/deploy.yml'   # redeploy if this workflow itself changes
  workflow_dispatch: {}                    # manual "redeploy current web/ as-is"

# Publish the built static artifact to the branch configured in Pages settings.
permissions:
  contents: write

# Shared with refresh.yml so a code publish and a data publish never race on the
# web-deployment branch. cancel-in-progress:false = queue behind an in-flight
# refresh rather than aborting it mid-pipeline.
concurrency:
  group: refresh-map-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Two-build emit (docs/PLAN_public_release.md §2a): fan web/ out into
      # _site/ = public root + _site/full/ = specialist. Pure code-shaping, no
      # data run — stdlib only, so the runner's system python3 is enough (keeps
      # this the fast code-only deploy). Shared with refresh.yml via the script.
      - name: Build two-build site tree (public root + /full/ specialist)
        run: python3 scripts/build_site.py --src web --out _site

      - name: Publish built site to web-deployment branch
        env:
          DEPLOY_BRANCH: web-deployment
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish_site_branch.sh _site
